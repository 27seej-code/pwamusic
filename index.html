      <label class="setRow"><span>HIDE SONG<small>Hide the song name and cover on the lock screen / home screen player</small></span>${chk("sHide", privacy.hide)}</label>
      <label class="setRow"><span>HIDE SONG MAX<small>Hide every song name in the whole app, only the first letter shows</small></span>${chk("sHideMax", privacy.max)}</label>
      <h4>Look</h4>
      <label class="setRow"><span>Song colour background<small>Tint the background with the playing song's cover colour</small></span>${chk("sTint", privacy.tint)}</label>
      <h4>Boost colours</h4>
      <label class="setRow"><span>Colour theme<small>Tint the app while a boost is on</small></span>${chk("sFx", fx.on)}</label>
      <label class="setRow"><span>Pulsing<small>Turn off if the app feels slow</small></span>${chk("sPulse", fx.pulse)}</label>
      <label class="setRow"><span>Bass boost colour</span><input type="color" id="sColBass" value="${fx.colors.bass}"></label>
      <label class="setRow"><span>Ultra boost colour</span><input type="color" id="sColUltra" value="${fx.colors.ultra}"></label>
      <label class="setRow"><span>Max boost colour</span><input type="color" id="sColMax" value="${fx.colors.max}"></label>
      <div class="sheetAction" id="sColReset" style="color:var(--ink-dim)">Reset colours</div>
      <h4>Library</h4>
      <div class="sheetAction" id="sBackup">Back up library…<small style="display:block;color:var(--ink-dim);font-size:12px;margin-top:2px">Save all songs and playlists to one file</small></div>
      <div class="sheetAction" id="sRestore">Restore from backup…<small style="display:block;color:var(--ink-dim);font-size:12px;margin-top:2px">Use this when moving to a new phone or new web address</small></div>
      <input type="file" id="restoreInput" accept=".sealbackup,application/octet-stream">`);

    $("sBass").addEventListener("change", e => { boost.bass = e.target.checked; saveBoost(); });
    $("sBassLvl").addEventListener("input", e => {
      boost.bassLevel = Number(e.target.value); $("sBassOut").textContent = boost.bassLevel;
      if (!boost.bass){ boost.bass = true; $("sBass").checked = true; }
      saveBoost();
    });
    $("sUltra").addEventListener("change", e => {
      boost.ultra = e.target.checked; if (boost.ultra){ boost.max = false; $("sMax").checked = false; } saveBoost();
    });
    $("sMax").addEventListener("change", e => {
      boost.max = e.target.checked; if (boost.max){ boost.ultra = false; $("sUltra").checked = false; } saveBoost();
    });
    $("sFx").addEventListener("change", e => { fx.on = e.target.checked; saveFx(); });
    $("sDuck").addEventListener("change", e => { notif.duck = e.target.checked; savePref("duckOn", notif.duck ? "1" : "0"); applyAudioSession(); });
    const savePrivacy = () => {
      savePref("hideSong", privacy.hide ? "1" : "0"); savePref("hideSongMax", privacy.max ? "1" : "0"); savePref("artTint", privacy.tint ? "1" : "0");
      renderCurrentView(); updateNowPlayingUI();
      const s = songById(currentSongId); if (s) updateMediaSession(s);
    };
    $("sHide").addEventListener("change", e => { privacy.hide = e.target.checked; savePrivacy(); });
    $("sHideMax").addEventListener("change", e => { privacy.max = e.target.checked; savePrivacy(); });
    $("sTint").addEventListener("change", e => { privacy.tint = e.target.checked; savePrivacy(); updateTint(); });
    $("sPulse").addEventListener("change", e => { fx.pulse = e.target.checked; saveFx(); });
    [["sColBass","bass"],["sColUltra","ultra"],["sColMax","max"]].forEach(([id, k]) =>
      $(id).addEventListener("input", e => { fx.colors[k] = e.target.value; saveFx(); }));
    $("sColReset").addEventListener("click", () => {
      Object.assign(fx.colors, BOOST_COLORS);
      $("sColBass").value = fx.colors.bass; $("sColUltra").value = fx.colors.ultra; $("sColMax").value = fx.colors.max;
      saveFx();
    });
    $("sBackup").addEventListener("click", backupLibrary);
    $("sRestore").addEventListener("click", () => $("restoreInput").click());
    $("restoreInput").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) restoreLibrary(f); });
  }

  /* ================= Backup / restore ================= */
  // File = "SEALBK1\n" + 12-digit header length + JSON header + raw song/art bytes.
  // Built from Blob slices, so even big libraries aren't loaded into memory at once.
  const BK_MAGIC = "SEALBK1\n";
  async function backupLibrary(){
    if (!songs.length){ toast("Library is empty"); return; }
    toast("Preparing backup…");
    const parts = [], meta = [];
    let offset = 0;
    const addPart = (b) => { const o = offset; parts.push(b); offset += b.size; return { offset: o, size: b.size, type: b.type || "" }; };
    for (const s of songs){
      if (!s.blob) continue;
      meta.push({
        id: s.id, name: s.name, addedAt: s.addedAt, duration: s.duration || null, ytId: s.ytId || null,
        audio: addPart(s.blob), art: s.art ? addPart(s.art) : null,
      });
    }
    const header = new TextEncoder().encode(JSON.stringify({ v: 1, created: Date.now(), songs: meta, playlists }));
    const file = new File([BK_MAGIC, String(header.length).padStart(12, "0"), header, ...parts],
      `seal-library-${new Date().toISOString().slice(0,10)}.sealbackup`, { type: "application/octet-stream" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: "Seal library backup" });
        toast("Backup saved");
        return;
      }
    } catch (err) { if (err && err.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast("Backup downloaded");
  }

  async function restoreLibrary(file){
    try {
      const magic = await file.slice(0, BK_MAGIC.length).text();
      if (magic !== BK_MAGIC) throw new Error("Not a Seal backup file");
      const hStart = BK_MAGIC.length + 12;
      const hLen = Number(await file.slice(BK_MAGIC.length, hStart).text());
      const header = JSON.parse(await file.slice(hStart, hStart + hLen).text());
      const base = hStart + hLen;
      const piece = (p) => file.slice(base + p.offset, base + p.offset + p.size, p.type);
      closeSheet();
      toast("Restoring…");
      const existing = new Map(songs.map(s => [s.name + "|" + (s.blob && s.blob.size), s.id]));
      const idMap = new Map();
      let added = 0;
      for (const m of header.songs || []){
        const key = m.name + "|" + m.audio.size;
        if (existing.has(key)){ idMap.set(m.id, existing.get(key)); continue; }
        // copy bytes out of the backup file so the song survives after the file is gone
        const blob = new Blob([await piece(m.audio).arrayBuffer()], { type: m.audio.type });
        const song = { name: m.name, blob, addedAt: m.addedAt || Date.now() };
        if (m.duration) song.duration = m.duration;
        if (m.ytId) song.ytId = m.ytId;
        if (m.art) song.art = new Blob([await piece(m.art).arrayBuffer()], { type: m.art.type || "image/jpeg" });
        song.id = await Store.addSong(song);
        songs.push(song); existing.set(key, song.id); idMap.set(m.id, song.id);
        added++;
      }
      for (const p of header.playlists || []){
        const ids = (p.songIds || []).map(id => idMap.get(id)).filter(id => id != null);
        let pl = playlists.find(x => x.name === p.name);
        if (pl){ ids.forEach(id => { if (!pl.songIds.includes(id)) pl.songIds.push(id); }); await Store.putPlaylist(pl); }
        else { pl = { name: p.name, songIds: ids }; pl.id = await Store.addPlaylist(pl); playlists.push(pl); }
      }
      renderCurrentView();
      toast(`Restored ${added} song${added === 1 ? "" : "s"}`);
    } catch (err) {
      toast((err && err.message) || "Restore failed");
    }
  }

  /* ================= Song lengths for older songs ================= */
  let probing = false;
  async function fillMissingDurations(){
    if (probing) return;
    probing = true;
    const probe = new Audio();
    probe.preload = "metadata"; probe.muted = true;
    let changed = 0;
    try {
      for (const s of songs.filter(s => !s.duration && s.blob)){
        const url = URL.createObjectURL(s.blob);
        const dur = await new Promise(res => {
          const done = (v) => { clearTimeout(t); probe.onloadedmetadata = probe.onerror = null; res(v); };
          const t = setTimeout(() => done(0), 6000);
          probe.onloadedmetadata = () => done(probe.duration);
          probe.onerror = () => done(0);
          probe.src = url;
        });
        URL.revokeObjectURL(url);
        if (isFinite(dur) && dur > 0 && songById(s.id)){
          s.duration = dur;
          await reqToPromise(tx("songs","readwrite").put(s)).catch(() => {});
          changed++;
          if (changed % 10 === 0) renderCurrentView();
        }
      }
    } finally {
      probe.removeAttribute("src"); probing = false;
      if (changed) renderCurrentView();
    }
  }

  /* ---- control wiring ---- */
  $("settingsBtn").addEventListener("click", openSettings);
  $("boostBtn").addEventListener("click", openSettings);
  $("stopBtn").addEventListener("click", stopPlayback);
  $("miniPlayPause").addEventListener("click", playPause);
  $("miniNext").addEventListener("click", nextTrack);
  $("playBtn").addEventListener("click", playPause);
  $("prevBtn").addEventListener("click", prevTrack);
  $("nextBtn").addEventListener("click", nextTrack);
  $("rewindBtn").addEventListener("click", () => seekBy(-15));
  $("forwardBtn").addEventListener("click", () => seekBy(15));
  $("shuffleBtn").addEventListener("click", toggleShuffle);
  $("repeatBtn").addEventListener("click", cycleRepeat);
  $("queueBtn").addEventListener("click", openQueueSheet);
  $("addToPlaylistFromPlayer").addEventListener("click", () => { if (currentSongId != null) openAddToPlaylistPicker([currentSongId]); });

  const fullPlayer = $("fullPlayer");
  function openFull(){ fullPlayer.classList.add("show"); fullOpen = true; lastSec = -1; updateProgress(); }
  function closeFull(){ fullPlayer.classList.remove("show"); fullOpen = false; }
  $("miniPlayer").addEventListener("click", (e) => { if (!e.target.closest(".miniBtn")) openFull(); });
  $("collapseBtn").addEventListener("click", closeFull);
  $("fpBack").addEventListener("click", closeFull);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ lastSec = -1; if (fullOpen) updateProgress(); } });

  /* ================= Boot ================= */
  // register first so the app is saved for offline use even if storage fails to open
  if ("serviceWorker" in navigator) setupUpdates();

  /* ================= Updates ================= */
  // Check for a new version whenever we're online; offer it, and apply it after 30s if ignored.
  function setupUpdates(){
    const sw = navigator.serviceWorker;
    let reg = null, timer = null, shownFor = null;
    const overlay = $("updateOverlay");

    function hide(){ clearInterval(timer); overlay.classList.remove("show"); }
    function apply(){
      hide();
      if (reg && reg.waiting) reg.waiting.postMessage("update");
    }
    function offer(){
      const w = reg && reg.waiting;
      if (!w || !sw.controller || shownFor === w) return;
      shownFor = w;
      let left = 30;
      $("updateCount").textContent = left;
      overlay.classList.add("show");
      clearInterval(timer);
      timer = setInterval(() => {
        left--; $("updateCount").textContent = left;
        if (left <= 0) apply();
      }, 1000);
    }
    function check(){
      if (!reg || !navigator.onLine) return;
      reg.update().then(offer, () => {});
    }

    $("updateNow").addEventListener("click", apply);
    // "Later" asks again the next time the app is opened or comes back online
    $("updateLater").addEventListener("click", () => { hide(); shownFor = null; });

    let reloading = false;
    sw.addEventListener("controllerchange", () => {
      if (reloading || !shownFor) return;
      reloading = true; location.reload();
    });

    sw.register("sw.js", { updateViaCache: "none" }).then((r) => {
      reg = r;
      r.addEventListener("updatefound", () => {
        const w = r.installing;
        if (w) w.addEventListener("statechange", () => { if (w.state === "installed") offer(); });
      });
      offer();
      check();
    }).catch(() => {});

    window.addEventListener("online", check);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
    setInterval(check, 30 * 60 * 1000);
  }
  async function boot(){
    updateModeUI();
    applyTheme();
    applyAudioSession();
    db = await openDB();
    songs = await Store.allSongs();
    playlists = await Store.allPlaylists();
    renderCurrentView();
    // ask the browser not to evict saved songs when the device is low on space
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    setTimeout(fillMissingDurations, 3000);
  }
  boot().catch(err => { libraryListEl.innerHTML = `<div class="empty"><b>Storage error</b>${escapeHtml(err && err.message || err)}</div>`; });
})();
</script>
